<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List з jQuery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 bg-light p-3">

<main class="card p-4 shadow-sm todo-card">
    <h1 class="h3 mb-3 text-center">Список завдань</h1>

    <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Введіть нове завдання...">
        <button id="addTask" class="btn btn-success">Додати завдання</button>
    </div>

    <ul id="taskList" class="list-group"></ul>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>
</body>
</html>
